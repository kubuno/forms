[package]
name        = "kubuno-forms-core"
version     = "0.1.0"
edition     = "2021"
description = "Kubuno Forms shared core (sans-IO): conditional logic (operators, hidden questions, jumps, reached path) and answer validation, run by the server on every submission and mirrored by the web client through conformance vectors"
license     = "AGPL-3.0"
repository  = "https://github.com/kubuno/forms"

# Sans-IO: no network, database, file system, clock, async runtime or UI. Data in, data out.
[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kubuno-vectors = { git = "https://github.com/kubuno/core", tag = "vectors-v0.1.0", package = "kubuno-vectors" }
